<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativos — Stock Analyzer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Ativos</h1>
        <a th:href="@{/assets/new}" class="btn btn-primary">Novo ativo</a>
    </div>

    <div th:if="${#lists.isEmpty(assets)}" class="alert alert-info">
        Nenhum ativo cadastrado ainda.
    </div>

    <table th:if="${!#lists.isEmpty(assets)}" class="table table-striped table-hover">
        <thead>
        <tr>
            <th>Código</th>
            <th>Nome</th>
            <th>Setor</th>
            <th class="text-end">Qtd. ações</th>
            <th class="text-end">Preço recom.</th>
            <th class="text-end">Último cálculo</th>
            <th class="text-end">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="asset : ${assets}">
            <td th:text="${asset.code}"></td>
            <td th:text="${asset.name}"></td>
            <td th:text="${asset.sector ?: '—'}"></td>
            <td class="text-end" th:text="${asset.sharesOutstanding != null} ? ${#numbers.formatInteger(asset.sharesOutstanding, 1, 'POINT')} : '—'"></td>
            <td class="text-end fw-bold text-success"
                th:text="${asset.recommendedPrice != null} ? 'R$ ' + ${#numbers.formatDecimal(asset.recommendedPrice, 1, 'POINT', 2, 'COMMA')} : '—'"></td>
            <td class="text-end text-muted small"
                th:text="${asset.lastCalculatedAt != null} ? ${#temporals.format(asset.lastCalculatedAt, 'dd/MM/yyyy HH:mm')} : '—'"></td>
            <td class="text-end">
                <a th:href="@{/assets/{id}/statements(id=${asset.id})}" class="btn btn-sm btn-outline-secondary">DREs</a>
                <a th:href="@{/assets/{id}/edit(id=${asset.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                <form th:action="@{/assets/{id}/delete(id=${asset.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Remover ativo?')">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Remover</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
