<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${assetId != null} ? 'Editar ativo' : 'Novo ativo'">Ativo — Stock Analyzer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4" style="max-width: 600px">
    <h1 class="h3 mb-4" th:text="${assetId != null} ? 'Editar ativo' : 'Novo ativo'"></h1>

    <form th:action="${assetId != null} ? @{/assets/{id}(id=${assetId})} : @{/assets}"
          th:object="${form}" method="post">

        <div class="mb-3">
            <label for="code" class="form-label">Código <span class="text-danger">*</span></label>
            <input type="text" id="code" th:field="*{code}" class="form-control text-uppercase"
                   th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'" maxlength="10">
            <div class="invalid-feedback" th:errors="*{code}"></div>
        </div>

        <div class="mb-3">
            <label for="name" class="form-label">Nome <span class="text-danger">*</span></label>
            <input type="text" id="name" th:field="*{name}" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" maxlength="100">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label for="sector" class="form-label">Setor</label>
            <input type="text" id="sector" th:field="*{sector}" class="form-control" maxlength="100">
        </div>

        <div class="mb-3">
            <label for="sharesOutstanding" class="form-label">Número de ações</label>
            <input type="number" id="sharesOutstanding" th:field="*{sharesOutstanding}" class="form-control" min="1">
            <div class="form-text">Quantidade total de ações emitidas (ex: 12888700000)</div>
        </div>

        <div class="mb-3">
            <label for="recommendedPrice" class="form-label">Preço recomendado (R$)</label>
            <input type="number" id="recommendedPrice" th:field="*{recommendedPrice}" class="form-control" step="0.01" min="0">
            <div class="form-text">Preenchido automaticamente pelo cálculo de indicadores (30% de margem de segurança). Pode ser ajustado manualmente.</div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a th:href="@{/assets}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
