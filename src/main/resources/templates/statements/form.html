<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${statementId != null} ? 'Editar DRE' : 'Nova DRE'">DRE — Stock Analyzer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4" style="max-width: 700px">
    <h1 class="h3 mb-1" th:text="${statementId != null} ? 'Editar DRE' : 'Nova DRE'"></h1>
    <p class="text-muted mb-4" th:text="${asset.code} + ' — ' + ${asset.name}"></p>

    <form th:action="${statementId != null}
            ? @{/assets/{aid}/statements/{sid}(aid=${asset.id},sid=${statementId})}
            : @{/assets/{aid}/statements(aid=${asset.id})}"
          th:object="${form}" method="post">

        <div class="row g-3 mb-3">
            <div class="col-sm-4">
                <label for="year" class="form-label">Ano <span class="text-danger">*</span></label>
                <input type="number" id="year" th:field="*{year}" class="form-control"
                       th:classappend="${#fields.hasErrors('year')} ? 'is-invalid'" min="2000" max="2100">
                <div class="invalid-feedback" th:errors="*{year}"></div>
            </div>
            <div class="col-sm-4">
                <label for="period" class="form-label">Período <span class="text-danger">*</span></label>
                <select id="period" th:field="*{period}" class="form-select"
                        th:classappend="${#fields.hasErrors('period')} ? 'is-invalid'">
                    <option value="">Selecione...</option>
                    <option th:each="p : ${periods}" th:value="${p}" th:text="${p}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{period}"></div>
            </div>
        </div>

        <h6 class="mt-4 mb-2 text-muted">Resultado</h6>
        <div class="row g-3 mb-3">
            <div class="col-sm-6">
                <label for="netRevenue" class="form-label">Receita líquida</label>
                <input type="number" id="netRevenue" th:field="*{netRevenue}" class="form-control" step="0.01">
            </div>
            <div class="col-sm-6">
                <label for="grossProfit" class="form-label">Lucro bruto</label>
                <input type="number" id="grossProfit" th:field="*{grossProfit}" class="form-control" step="0.01">
            </div>
            <div class="col-sm-6">
                <label for="ebitda" class="form-label">EBITDA</label>
                <input type="number" id="ebitda" th:field="*{ebitda}" class="form-control" step="0.01">
            </div>
            <div class="col-sm-6">
                <label for="ebit" class="form-label">EBIT</label>
                <input type="number" id="ebit" th:field="*{ebit}" class="form-control" step="0.01">
            </div>
            <div class="col-sm-6">
                <label for="netIncome" class="form-label">Lucro líquido</label>
                <input type="number" id="netIncome" th:field="*{netIncome}" class="form-control" step="0.01">
            </div>
        </div>

        <h6 class="mt-4 mb-2 text-muted">Caixa</h6>
        <div class="row g-3 mb-3">
            <div class="col-sm-6">
                <label for="operatingCashFlow" class="form-label">Fluxo de caixa operacional (FCO)</label>
                <input type="number" id="operatingCashFlow" th:field="*{operatingCashFlow}" class="form-control" step="0.01">
            </div>
            <div class="col-sm-6">
                <label for="freeCashFlow" class="form-label">Fluxo de caixa livre (FCL)</label>
                <input type="number" id="freeCashFlow" th:field="*{freeCashFlow}" class="form-control" step="0.01">
            </div>
        </div>

        <h6 class="mt-4 mb-2 text-muted">Balanço</h6>
        <div class="row g-3 mb-4">
            <div class="col-sm-6">
                <label for="totalDebt" class="form-label">Dívida bruta</label>
                <input type="number" id="totalDebt" th:field="*{totalDebt}" class="form-control" step="0.01">
            </div>
            <div class="col-sm-6">
                <label for="netDebt" class="form-label">Dívida líquida</label>
                <input type="number" id="netDebt" th:field="*{netDebt}" class="form-control" step="0.01">
            </div>
            <div class="col-sm-6">
                <label for="equity" class="form-label">Patrimônio líquido</label>
                <input type="number" id="equity" th:field="*{equity}" class="form-control" step="0.01">
            </div>
            <div class="col-sm-6">
                <label for="totalAssets" class="form-label">Ativo total</label>
                <input type="number" id="totalAssets" th:field="*{totalAssets}" class="form-control" step="0.01">
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a th:href="@{/assets/{id}/statements(id=${asset.id})}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
