<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${asset.code} + ' — DREs'">DREs — Stock Analyzer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-1">
        <h1 class="h3" th:text="${asset.code} + ' — ' + ${asset.name}"></h1>
        <div class="d-flex gap-2">
            <a th:href="@{/assets}" class="btn btn-outline-secondary btn-sm">Voltar</a>
            <a th:href="@{/assets/{id}/statements/new(id=${asset.id})}" class="btn btn-primary btn-sm">Nova DRE</a>
        </div>
    </div>
    <p class="text-muted mb-3" th:text="${asset.sector ?: ''}"></p>

    <div th:if="${#lists.isEmpty(statements)}" class="alert alert-info">
        Nenhuma DRE cadastrada para este ativo.
    </div>

    <table th:if="${!#lists.isEmpty(statements)}" class="table table-sm table-striped table-hover">
        <thead>
        <tr>
            <th>Ano</th>
            <th>Período</th>
            <th class="text-end">Receita Líq.</th>
            <th class="text-end">EBITDA</th>
            <th class="text-end">Lucro Líq.</th>
            <th class="text-end">FCL</th>
            <th class="text-end">PL</th>
            <th class="text-end">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${statements}">
            <td th:text="${s.year}"></td>
            <td th:text="${s.period}"></td>
            <td class="text-end" th:text="${#numbers.formatDecimal(s.netRevenue, 1, 'POINT', 2, 'COMMA')}"></td>
            <td class="text-end" th:text="${#numbers.formatDecimal(s.ebitda, 1, 'POINT', 2, 'COMMA')}"></td>
            <td class="text-end" th:text="${#numbers.formatDecimal(s.netIncome, 1, 'POINT', 2, 'COMMA')}"></td>
            <td class="text-end" th:text="${#numbers.formatDecimal(s.freeCashFlow, 1, 'POINT', 2, 'COMMA')}"></td>
            <td class="text-end" th:text="${#numbers.formatDecimal(s.equity, 1, 'POINT', 2, 'COMMA')}"></td>
            <td class="text-end">
                <a th:href="@{/assets/{aid}/statements/{sid}(aid=${asset.id},sid=${s.id})}"
                   class="btn btn-sm btn-outline-primary">Editar</a>
                <form th:action="@{/assets/{aid}/statements/{sid}/delete(aid=${asset.id},sid=${s.id})}"
                      method="post" class="d-inline" onsubmit="return confirm('Remover DRE?')">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Remover</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
