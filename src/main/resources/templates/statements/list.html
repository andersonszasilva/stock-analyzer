<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${asset.code} + ' — DREs'">DREs — Stock Analyzer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .table th, .table td { white-space: nowrap; }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>
<div class="container-fluid mt-4 px-4">
    <div class="d-flex justify-content-between align-items-center mb-1">
        <h1 class="h3" th:text="${asset.code} + ' — ' + ${asset.name}"></h1>
        <div class="d-flex gap-2">
            <a th:href="@{/assets}" class="btn btn-outline-secondary btn-sm">Voltar</a>
            <a th:href="@{/assets/{id}/statements/new(id=${asset.id})}" class="btn btn-primary btn-sm">Nova DRE</a>
        </div>
    </div>
    <p class="text-muted mb-3" th:text="${asset.sector ?: ''}"></p>

    <div th:if="${#lists.isEmpty(statements)}" class="alert alert-info">
        Nenhuma DRE cadastrada para este ativo.
    </div>

    <div th:if="${!#lists.isEmpty(statements)}" class="table-responsive">
        <table class="table table-sm table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Ano</th>
                <th>Período</th>
                <th>Unidade</th>
                <th class="num">Receita líquida</th>
                <th class="num">Lucro bruto</th>
                <th class="num">EBITDA</th>
                <th class="num">EBIT</th>
                <th class="num">Lucro líquido</th>
                <th class="num">FCO</th>
                <th class="num">FCL</th>
                <th class="num">Dívida bruta</th>
                <th class="num">Dívida líquida</th>
                <th class="num">Patrim. líquido</th>
                <th class="num">Ativo total</th>
                <th class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${statements}">
                <td th:text="${s.year}"></td>
                <td th:text="${s.period}"></td>
                <td><span class="badge text-bg-secondary" th:text="${s.monetaryUnit}"></span></td>
                <td class="num" th:text="${#numbers.formatDecimal(s.netRevenue,    1, 'POINT', 2, 'COMMA')}"></td>
                <td class="num" th:text="${#numbers.formatDecimal(s.grossProfit,   1, 'POINT', 2, 'COMMA')}"></td>
                <td class="num" th:text="${#numbers.formatDecimal(s.ebitda,        1, 'POINT', 2, 'COMMA')}"></td>
                <td class="num" th:text="${#numbers.formatDecimal(s.ebit,          1, 'POINT', 2, 'COMMA')}"></td>
                <td class="num" th:text="${#numbers.formatDecimal(s.netIncome,     1, 'POINT', 2, 'COMMA')}"></td>
                <td class="num" th:text="${#numbers.formatDecimal(s.operatingCashFlow, 1, 'POINT', 2, 'COMMA')}"></td>
                <td class="num" th:text="${#numbers.formatDecimal(s.freeCashFlow,  1, 'POINT', 2, 'COMMA')}"></td>
                <td class="num" th:text="${#numbers.formatDecimal(s.totalDebt,     1, 'POINT', 2, 'COMMA')}"></td>
                <td class="num" th:text="${#numbers.formatDecimal(s.netDebt,       1, 'POINT', 2, 'COMMA')}"></td>
                <td class="num" th:text="${#numbers.formatDecimal(s.equity,        1, 'POINT', 2, 'COMMA')}"></td>
                <td class="num" th:text="${#numbers.formatDecimal(s.totalAssets,   1, 'POINT', 2, 'COMMA')}"></td>
                <td class="text-end">
                    <a th:href="@{/assets/{aid}/statements/{sid}(aid=${asset.id},sid=${s.id})}"
                       class="btn btn-sm btn-outline-primary" title="Editar">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <form th:action="@{/assets/{aid}/statements/{sid}/delete(aid=${asset.id},sid=${s.id})}"
                          method="post" class="d-inline" onsubmit="return confirm('Remover DRE?')">
                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Remover">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
