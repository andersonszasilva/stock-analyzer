pluginManagement {
    plugins {
        id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    }
}
rootProject.name = 'stock-analyzer'

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        maven { url = uri("https://repo.spring.io/milestone") }
        maven { url = uri("https://repo.spring.io/snapshot") }
    }
}
